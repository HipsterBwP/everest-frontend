name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rp5-launcher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Builds from main become GitHub releases; the launcher's updater installs the latest one.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rp5-launcher.apk
          git log -1 --pretty=%s > notes.txt
          gh release create "build-${{ github.run_number }}" rp5-launcher.apk \
            --title "Build ${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}" \
            --latest
